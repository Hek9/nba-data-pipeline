name: NBA Analytics End-to-End Pipeline

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  # Permite ejecutar el flujo manualmente desde el botón en GitHub Actions
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar Microsoft ODBC Driver 18 para SQL Server
        run: |
          sudo ACCEPT_EULA=Y apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: 4. Instalar librerías de Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas azure-storage-blob pyodbc sqlalchemy python-dotenv requests nba_api pyarrow

      - name: 5. Ejecutar Pipeline End-to-End
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          echo "=== 1/4: Extracción desde API NBA ==="
          python 01_extract_nba.py

          echo "=== 2/4: Carga a Azure Blob Storage ==="
          python 02_upload_to_azure.py

          echo "=== 3/4: Carga a Azure SQL (Staging) ==="
          python 03_load_to_sql.py

          echo "=== 4/4: Transformación ELT en Azure SQL ==="
          python 04_transform_elt.py